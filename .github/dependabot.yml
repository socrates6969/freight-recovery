# Dependabot keeps every pinned input current. Each update arrives as a PR, runs the full CI
# (tests, pip-audit, trivy, container smoke test) and is merged deliberately.
version: 2
updates:
  # Python: requirements.in / requirements-dev.in are the sources; the hash-locked
  # requirements*.txt files are regenerated with them (pip-compile workflow).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Developer portal tooling (MkDocs + Material), hash-locked like the rest.
  - package-ecosystem: pip
    directory: "/developer-portal"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(portal)"
    groups:
      portal-minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions stay pinned to commit SHAs; Dependabot rewrites the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Dockerfile base image (pinned by digest).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"

  # docker-compose.yml images (postgres, pinned by digest). The local DB should track the
  # RDS major version, so major bumps are a deliberate manual decision, not a bot PR.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"

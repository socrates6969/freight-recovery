name: web-ci
on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "web/**"
      - "packages/**"
      - "infra/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".nvmrc"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "compose.web.yml"
      - ".github/workflows/web-ci.yml"
      # The API acceptance suite checks packet parity against the Python CLI.
      - "requirements.txt"
      - "pyproject.toml"
      - "src/freight_recovery/**"
      - "tests/fixtures/**"
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "packages/**"
      - "infra/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".nvmrc"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "compose.web.yml"
      - ".github/workflows/web-ci.yml"
      # The API acceptance suite checks packet parity against the Python CLI.
      - "requirements.txt"
      - "pyproject.toml"
      - "src/freight_recovery/**"
      - "tests/fixtures/**"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the repository only. No secrets are used; every secret-looking value below is
# a PUBLIC CI-only value (the API refuses them in production).
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment).

jobs:
  node:
    name: TS monorepo (lint, typecheck, unit, migrate, seed, acceptance, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://freight_app:local-dev-only@127.0.0.1:5433/freight_web_test
      TEST_ADMIN_DATABASE_URL: postgresql://freight_owner:local-dev-only@127.0.0.1:5433/freight_web_test
      DATABASE_URL: postgresql://freight_app:local-dev-only@127.0.0.1:5433/freight_web_test
      MIGRATE_DATABASE_URL: postgresql://freight_owner:local-dev-only@127.0.0.1:5433/freight_web_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdefghij
      CSRF_SECRET: ci-only-csrf-secret-not-for-production-0123456789abcdefghi
      REFRESH_PEPPER: ci-only-refresh-pepper-not-for-production-0123456789abcdef
      MFA_ENC_KEY: Y2ktb25seS1tZmEta2V5LW5vdC1mb3ItcHJvZHVjdCE=
      API_KEY_PEPPER: ci-only-api-key-pepper-not-for-production-0123456789abcdef
      APP_ORIGIN: http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      ENABLE_DEV_OUTBOX: "true"
      ARGON2_MEMORY_KIB: "1024"
      ARGON2_TIME_COST: "1"
      # MinIO (started below) with PUBLIC CI-only credentials and KMS key.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: fr-documents-ci
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ci-only-minio
      S3_SECRET_ACCESS_KEY: ci-only-minio-secret-not-for-production
      S3_SSE: aws:kms
      S3_KMS_KEY_ID: fr-ci-key
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create database roles and databases
        run: bash api/db/init/ci-init.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: ci-only
      - name: Start MinIO (loopback, tmpfs, SSE-KMS with a public CI key)
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 --tmpfs /data:mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            -e MINIO_KMS_SECRET_KEY="fr-ci-key:Y2ktb25seS1taW5pby1rbXMta2V5LW5vdC1wcm9kISE=" \
            -e MINIO_BROWSER=off \
            chainguard/minio@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0 \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs minio
          exit 1
      - run: npm ci --ignore-scripts
      - run: npm run verify:no-install-scripts
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run ensure-bucket
      # The parse worker is a build artifact used by the integration and acceptance suites.
      - run: npm run build
      # Step 4: extraction evaluation on the committed SYNTHETIC set (sandboxed parser, no database,
      # nothing recorded). Fails the job unless every case passes all 3 runs. Not an accuracy measure.
      - name: Evaluation (synthetic fixtures)
        run: npm run eval -- --set api/eval/sets/extraction-v1 --k 3 --min-pass-hat-k 1 --json
      # The integration (extraction parity) and acceptance (packet parity) suites run the existing
      # Python code. Same setup as ci.yml: pinned setup-python, hash-locked runtime deps, PYTHONPATH=src.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements.txt
      - run: npm run test:integration
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - run: npm run test:acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - run: npm run audit
      - run: npm audit signatures

  terraform:
    name: Terraform (fmt, validate; never applied)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  compose:
    name: Compose files parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker compose -f compose.web.yml config -q
      - run: docker compose -f docker-compose.yml config -q

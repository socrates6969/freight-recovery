   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="8.28" y="30.288" transform="rotate(-0 8.28 30.288)">How the agents find an overcharge and turn it into a claim</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(8.28 245.037859)">Money is computed by deterministic, tested code (dark). An optional language model only does judgment in Intake, Contract &amp;</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(8.28 255.600266)">tariff, Reviewer and Claim. The Reviewer recomputes every finding, the Claim agent drafts only from confirmed findings, and a</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(8.28 266.162672)">person approves (orange). Code: unit-tested, not yet wired into the web app. Synthetic test only: 0 of 45 clean invoices claimed;</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(8.28 276.725078)">90 of 90 injected overcharges flagged to the cent.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7785" x="8.28" y="296.993466" transform="rotate(-0 8.28 296.993466)">Source: technical/agents.md (origin/master e3fef5f, 2026-10-22). Synthetic data; not a real-world performance claim.</text>
  </g>

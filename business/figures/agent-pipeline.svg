    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(63.036508 87.245297)">1  Intake</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(71.046937 98.647152)">agent</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(43.896625 158.43337)">reads invoices, BOLs,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(50.859125 168.035558)">rate cons, emails;</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(41.154125 177.637745)">keeps the source page</text>
   </g>

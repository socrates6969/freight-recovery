   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="8.28" y="30.288" transform="rotate(-0 8.28 30.288)">How the agents find an overcharge and turn it into a claim</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(8.28 266.162672)">Language models read documents and draft text (blue). Money is computed by deterministic, tested code (dark). A separate reviewer</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(8.28 276.725078)">agent and then a person check everything before a claim leaves (orange).</text>
  </g>
  <g id="text_15">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7785" x="8.28" y="296.993466" transform="rotate(-0 8.28 296.993466)">Source: Scoup product design (technical/overview.md; agent build on branch feat/audit-agents). A design description, not a performance claim.</text>

  <g id="text_27">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(6.48 319.442672)">Year 3: $10K fee + 14% of $85K recovered = $21.9K. At 64% gross margin, 20% yearly churn and $0.68 of sales cost per $1 of new</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(6.48 330.005078)">ARR, acquisition cost is repaid in about 13 months. Every input is an assumption.</text>

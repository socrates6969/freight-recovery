site_name: scoup.ai developer portal
site_description: Developer documentation for the scoup.ai workspace API, a prototype that is not offered to customers yet. Documents the real current API.
# Published under /docs/ of the marketing site: marketing/site/build.mjs copies site/ to dist/docs when
# SITE_DOCS_DIR points at it, and .github/workflows/pages.yml does so on every deploy. site_url only feeds the
# canonical link and the sitemap; page and asset links stay relative, so a local build works from any path.
site_url: https://socrates6969.github.io/freight-recovery/docs/
docs_dir: docs
strict: true

theme:
  name: material
  # The pages load nothing from the network: no Google Fonts (font: false uses the system font stack),
  # no analytics, no CDN scripts. marketing/site/test.mjs fails the deploy if an external URL appears.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra:
  # No "Made with Material for MkDocs" footer link: the portal links to nothing outside the site.
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Authentication: authentication.md
  - Quickstart: quickstart.md
  - API reference:
      - Endpoints and schemas: api/reference.md
  - SDK and usage examples: sdk.md
  - Errors: errors.md
  - Rate limits (planned): rate-limits.md
  - Changelog: changelog.md

# api/openapi.json is copied verbatim (not a Markdown page).
not_in_nav: |
  /api/openapi.json
